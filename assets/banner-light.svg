      <text x="885" y="149">1</text><text x="926" y="149">2</text><text x="956" y="149" fill="#1c1c1e" font-weight="700">3</text><text x="1018" y="149">4</text><text x="1060" y="149">5</text><text x="1096" y="149">6</text>
    </g>
    <circle cx="842" cy="190" r="12" fill="#e6e0d6" opacity=".7"/>
    <text x="864" y="195" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="14" fill="#6b6b73">Parents Bedroom</text>
    <circle cx="842" cy="234" r="12" fill="#e6e0d6" opacity=".7"/>
