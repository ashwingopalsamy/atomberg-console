<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Atomberg Console: a quiet menu bar console for fans, purifiers and locks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1ec"/><stop offset="1" stop-color="#e9e4dc"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34343a"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>
    <path id="blade" d="M50 45 C43 31 45 11 61 11 C76 11 71 36 55 47 Z"/>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g><g transform="translate(49.0 85.0) scale(1.5)">
      <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#tile)"/>
      <g fill="#fff"><animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="9s" repeatCount="indefinite"/><use href="#blade" transform="rotate(0 50 50)"/><use href="#blade" transform="rotate(90 50 50)"/><use href="#blade" transform="rotate(180 50 50)"/><use href="#blade" transform="rotate(270 50 50)"/></g>
      <circle cx="50" cy="50" r="6.5" fill="#1b1b1f"/><circle cx="50" cy="50" r="3" fill="#fff"/>
    </g></g>
  <text x="228" y="148" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#1c1c1e">Atomberg Console</text>
  <text x="230" y="188" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#6b6b73">one click. every fan. zero noise.</text>
  <text x="230" y="216" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b6b73">an unofficial menu bar console · macOS 26 · local first · calls no one else</text>

  <g>
    <rect x="804" y="52" width="340" height="248" rx="24" fill="#000000" opacity="0.14"/>
    <rect x="800" y="44" width="340" height="248" rx="22" fill="#000000" opacity="0.07"/>
    <rect x="800" y="36" width="340" height="248" rx="22" fill="#ffffff" stroke="#dcd6cc"/>
