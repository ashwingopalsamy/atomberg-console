    <circle cx="1068" cy="66" r="12" fill="#e6e0d6"/><circle cx="1104" cy="66" r="12" fill="#e6e0d6"/>
    <rect x="814" y="88" width="312" height="184" rx="14" fill="#f3efe8"/>
    <circle cx="842" cy="112" r="12" fill="#e6e0d6"/>
    <text x="864" y="117" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="14" fill="#1c1c1e">Living Room</text>
    <rect x="1070" y="102" width="42" height="20" rx="10" fill="#00c7d6"/><circle cx="1101" cy="112" r="8" fill="#fff"/>
    <rect x="864" y="134" width="248" height="22" rx="11" fill="#e6e0d6"/>
    <rect x="936" y="136" width="40" height="18" rx="9" fill="#ffffff"/>
