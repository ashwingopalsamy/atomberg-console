<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Atomberg Console talks to the Atomberg API over HTTPS and to your fans over your Wi-Fi. Nothing else.">
  <style>
  :root { --bg:#f4f1ec; --panel:#ffffff; --line:#cfc8bc; --ink:#1c1c1e; --sub:#6b6b73; --accent:#00a8b5; --warn:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e10; --panel:#1c1c1f; --line:#3a3a40; --ink:#f5f5f7; --sub:#9a9aa3; --accent:#00c7d6; --warn:#ff6b5e; } }
  text { font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; }
</style>
  <rect width="900" height="300" rx="20" fill="var(--bg)"/>

  <!-- the app -->
  <rect x="330" y="100" width="240" height="100" rx="20" fill="var(--panel)" stroke="var(--line)"/>
  <text x="450" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">Atomberg Console</text>
  <text x="450" y="172" text-anchor="middle" font-size="13" fill="var(--sub)">your Mac</text>

  <!-- cloud -->
  <rect x="640" y="28" width="224" height="100" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="752" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">api.developer</text>
  <text x="752" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">.atomberg-iot.com</text>
  <text x="752" y="108" text-anchor="middle" font-size="13" fill="var(--sub)">HTTPS · port 443</text>
  <path d="M570 130 C610 130 610 78 640 78" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- fans -->
  <rect x="640" y="180" width="224" height="84" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="752" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">your fans</text>
  <text x="752" y="238" text-anchor="middle" font-size="13" fill="var(--sub)">same Wi‑Fi · UDP 5625 / 5600</text>
  <path d="M570 170 C610 170 610 222 640 222" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- nothing else -->
  <rect x="36" y="100" width="224" height="100" rx="16" fill="none" stroke="var(--line)" stroke-dasharray="6 6"/>
  <text x="148" y="140" text-anchor="middle" font-size="14" fill="var(--sub)">analytics · telemetry</text>
  <text x="148" y="162" text-anchor="middle" font-size="14" fill="var(--sub)">updates · anything else</text>
  <path d="M260 150 L330 150" stroke="var(--warn)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>
  <g stroke="var(--warn)" stroke-width="3" stroke-linecap="round"><path d="M284 138 l24 24"/><path d="M308 138 l-24 24"/></g>
  <text x="148" y="240" text-anchor="middle" font-size="12" fill="var(--sub)">refused in code · checked in CI</text>
</svg>
