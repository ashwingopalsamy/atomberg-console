name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-egress.sh
      - run: swift test
      - name: Build, ad hoc signed with the hardened runtime
        run: ATOMBERG_SIGN=adhoc scripts/bundle.sh
      - name: Pack
        run: scripts/dmg.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.dmg
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$TAG" build/*.dmg build/*.sha256 --title "$TAG" --notes-file notes.md
